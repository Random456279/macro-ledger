# Cloudflare config for the standalone Macro Ledger. Deployed by Cloudflare Workers Builds on every push to main.
name = "macro-ledger"
main = "worker/index.js"
compatibility_date = "2025-09-01"
keep_vars = true   # variables set in the dashboard survive deploys

[assets]
directory = "./dist/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "macro-ledger"
database_id = "65df8015-9a81-401a-b69d-ddfe47252875"

[vars]
MODEL_QUICK = "claude-haiku-5-5"
MODEL_DEFAULT = "claude-sonnet-5-5"
AI_DAILY_CAP = "150"
# sha256 of the owner's device key (the key itself is only on the phone). Rotate by replacing this and redeploying.
OWNER_KEY_HASH = "da3d18700ea551192c5b556e3178b393eadc35b65a7184bf074af368e0ba2768"

[observability]
enabled = true
