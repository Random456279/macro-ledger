# Cloudflare config for the standalone Macro Ledger. tools/setup.mjs fills in database_id.
name = "macro-ledger"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "macro-ledger"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
MODEL_QUICK = "claude-haiku-5-5"
MODEL_DEFAULT = "claude-sonnet-5-5"
AI_DAILY_CAP = "150"

[observability]
enabled = true
